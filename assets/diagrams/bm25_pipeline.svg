<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">BM25 Retrieval Pipeline</title><desc id="desc">Lexical indexing, retrieval, conversion, and evaluation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="1400" height="760" fill="#F8FAFC"/><text x="700" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">BM25 Retrieval Pipeline</text><text x="700" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Lexical indexing, retrieval, conversion, and evaluation.</text><g filter="url(#shadow)"><rect x="45" y="155" width="190" height="145" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="45" y="155" width="7" height="145" rx="4" fill="#2563EB"/><text x="143" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Document preparation</text><text x="143" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="143" dy="0">Concatenate title</tspan><tspan x="143" dy="20">and text</tspan></text></g><g filter="url(#shadow)"><rect x="265" y="155" width="190" height="145" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="265" y="155" width="7" height="145" rx="4" fill="#2563EB"/><text x="363" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Tokenisation</text><text x="363" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="363" dy="0">bm25s.tokenize</tspan><tspan x="363" dy="20">No stemming or</tspan><tspan x="363" dy="20">stop-word removal</tspan></text></g><g filter="url(#shadow)"><rect x="485" y="155" width="190" height="145" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="485" y="155" width="7" height="145" rx="4" fill="#2563EB"/><text x="583" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">BM25 indexing</text><text x="583" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="583" dy="0">Build sparse</tspan><tspan x="583" dy="20">BM25 index</tspan></text></g><g filter="url(#shadow)"><rect x="705" y="155" width="190" height="145" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="705" y="155" width="7" height="145" rx="4" fill="#2563EB"/><text x="803" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Top-100 retrieval</text><text x="803" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="803" dy="0">Retrieve 100 docs</tspan><tspan x="803" dy="20">for each query</tspan></text></g><g filter="url(#shadow)"><rect x="925" y="155" width="190" height="145" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="925" y="155" width="7" height="145" rx="4" fill="#2563EB"/><text x="1023" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">BEIR conversion</text><text x="1023" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="1023" dy="0">Map query IDs to</tspan><tspan x="1023" dy="20">document scores</tspan></text></g><g filter="url(#shadow)"><rect x="1145" y="155" width="190" height="145" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="1145" y="155" width="7" height="145" rx="4" fill="#2563EB"/><text x="1243" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Metric evaluation</text><text x="1243" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="1243" dy="0">Compare with qrels</tspan><tspan x="1243" dy="20">NDCG, MAP, recall, P</tspan></text></g><path d="M 235 227 L 265 227" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><path d="M 455 227 L 485 227" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><path d="M 675 227 L 705 227" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><path d="M 895 227 L 925 227" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1115 227 L 1145 227" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><rect x="110" y="380" width="535" height="190" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/><text x="377" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Baseline BM25</text><rect x="205" y="440" width="150" height="34" rx="17" fill="#DBEAFE" stroke="#2563EB"/><text x="280" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">k1 = 0.9</text><rect x="400" y="440" width="150" height="34" rx="17" fill="#DBEAFE" stroke="#2563EB"/><text x="475" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">b = 0.4</text><text x="377" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#475569"><tspan x="377" dy="0">Reference lexical configuration</tspan></text><rect x="755" y="380" width="535" height="190" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/><text x="1022" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Tuned BM25</text><rect x="850" y="440" width="150" height="34" rx="17" fill="#CCFBF1" stroke="#0F766E"/><text x="925" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">k1 = 0.9</text><rect x="1045" y="440" width="150" height="34" rx="17" fill="#CCFBF1" stroke="#0F766E"/><text x="1120" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">b = 0.75</text><text x="1022" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#475569"><tspan x="1022" dy="0">Best stored NDCG@10 configuration</tspan></text><rect x="120" y="630" width="1160" height="80" rx="12" fill="#FEF3C7" stroke="#B45309"/><text x="700" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Parameter interpretation</text><text x="700" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#475569"><tspan x="700" dy="0">k1 controls term-frequency saturation   |   b controls document-length normalisation</tspan></text></svg>