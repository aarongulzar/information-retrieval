<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Evaluation Workflow</title><desc id="desc">Stored retrieval rankings are evaluated against FiQA relevance judgements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter></defs><rect width="1200" height="650" fill="#F8FAFC"/><text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Evaluation Workflow</text><text x="600" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Stored retrieval rankings are evaluated against FiQA relevance judgements.</text><g filter="url(#shadow)"><rect x="80" y="170" width="260" height="130" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><rect x="80" y="170" width="7" height="130" rx="4" fill="#2563EB"/><text x="213" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Retrieved rankings</text><text x="213" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="213" dy="0">Top-100 document scores</tspan><tspan x="213" dy="20">for each test query</tspan></text></g><g filter="url(#shadow)"><rect x="80" y="360" width="260" height="130" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><rect x="80" y="360" width="7" height="130" rx="4" fill="#B45309"/><text x="213" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">FiQA qrels</text><text x="213" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="213" dy="0">Ground-truth relevance</tspan><tspan x="213" dy="20">for the test queries</tspan></text></g><g filter="url(#shadow)"><rect x="470" y="250" width="260" height="150" rx="12" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/><rect x="470" y="250" width="7" height="150" rx="4" fill="#6D28D9"/><text x="603" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">BEIR evaluation</text><text x="603" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="603" dy="0">EvaluateRetrieval</tspan><tspan x="603" dy="20">Rankings compared</tspan><tspan x="603" dy="20">with qrels</tspan></text></g><path d="M 340 235 L 405 235 L 405 300 L 470 300" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><path d="M 340 425 L 405 425 L 405 350 L 470 350" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="845" y="120" width="260" height="340" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><rect x="845" y="120" width="7" height="340" rx="4" fill="#0F766E"/><text x="978" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Reported metrics</text><text x="978" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569"><tspan x="978" dy="0">NDCG@10</tspan><tspan x="978" dy="20">Ranking quality at 10</tspan><tspan x="978" dy="20"></tspan><tspan x="978" dy="20">MAP@100</tspan><tspan x="978" dy="20">Average precision at 100</tspan><tspan x="978" dy="20"></tspan><tspan x="978" dy="20">Recall@100</tspan><tspan x="978" dy="20">Relevant coverage at 100</tspan><tspan x="978" dy="20"></tspan><tspan x="978" dy="20">P@10</tspan><tspan x="978" dy="20">Precision at 10</tspan></text></g><path d="M 730 325 L 845 325" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><rect x="145" y="540" width="910" height="72" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="600" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Methodological limitation</text><text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#475569"><tspan x="600" dy="0">BM25 parameter selection was performed on the test split used for final evaluation.</tspan></text></svg>